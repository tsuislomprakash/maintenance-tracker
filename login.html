<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Maintenance Management Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <h2 style="color: #1a237e; margin-bottom: 5px;">Portal Access Login</h2>
    <p style="color: #607d8b; font-size: 13px; margin-bottom: 20px;">Central Maintenance & Stock System</p>
    
    <div id="errorAlert" class="error-message">Invalid Username or Password!</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username / ID</label>
        <input type="text" id="username" placeholder="Enter Authorized Username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter Password" required autocomplete="current-password">
      </div>

      <button type="submit" class="submit-btn" style="width: 100%;">Sign In</button>
    </form>
  </div>

  <script>
    const USERS_DB = {
      "CLIENT": { pass: "CLIENT@123", role: "client", name: "Tata Steel Client (Master)" },
      "MASTER": { pass: "MASTER@123", role: "client", name: "Tata Steel Master Authority" },
      "ADMIN": { pass: "ADMIN@123", role: "admin", name: "Central Administrator" },
      "SUPERVISOR": { pass: "SUPER@123", role: "supervisor", name: "Field Duty Supervisor" }
    };

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim().toUpperCase();
      const p = document.getElementById('password').value.trim();
      const errBox = document.getElementById('errorAlert');

      if (USERS_DB[u] && USERS_DB[u].pass === p) {
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('activeUser', USERS_DB[u].name);
        sessionStorage.setItem('userRole', USERS_DB[u].role);

        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect');

        if (redirectUrl) {
          window.location.href = decodeURIComponent(redirectUrl);
        } else {
          window.location.href = 'index.html';
        }
      } else {
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>

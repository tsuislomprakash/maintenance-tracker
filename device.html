<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dedicated Equipment Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width:700px;">
    <header>
      <div class="header-left">
        <h2>Field Unit Access</h2>
        <small style="color:#607d8b;">Dedicated Control Panel Interface</small>
      </div>
      <div id="authHeader" class="user-controls"></div>
    </header>

    <div class="device-header-card">
      <h3 id="panelIdDisplay" style="color:#1a237e;">Scanning Unit...</h3>
      <p id="panelDetailsDisplay" style="font-size:14px; margin-top:5px; color:#455a64;"></p>
    </div>

    <div class="card-grid" style="grid-template-columns: 1fr 1fr;">
      <div class="card">
        <h3>Fill Maintenance</h3>
        <p>Log routine 15-day maintenance or breakdown for this unit.</p>
        <button onclick="goToForm()" class="submit-btn" style="width:100%; margin:0;">Open Form</button>
      </div>

      <div class="card">
        <h3>View History</h3>
        <p>Inspect past maintenance records for this unit only.</p>
        <button onclick="goToHistory()" class="nav-btn" style="width:100%; background:#37474f; padding:12px;">Unit History</button>
      </div>
    </div>
  </div>

  <script>
    let currentSystemId = "";

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      currentSystemId = urlParams.get('id');

      if (!currentSystemId) {
        alert("Invalid QR Code: No System ID detected.");
        window.location.href = "index.html";
        return;
      }

      document.getElementById('panelIdDisplay').innerText = `System ID: ${currentSystemId}`;
      document.getElementById('panelDetailsDisplay').innerText = `Connected to field maintenance network. All actions locked to this unit.`;
      renderUserControls();
    };

    function renderUserControls() {
      const authBox = document.getElementById('authHeader');
      const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';
      const user = sessionStorage.getItem('activeUser');

      if (isLoggedIn) {
        authBox.innerHTML = `
          <span class="user-badge-info">👤 <strong>${user}</strong></span>
          <a href="index.html" class="nav-btn" style="background:#546e7a;">Dashboard</a>
          <button onclick="switchAccount()" class="btn-switch">Switch</button>
          <button onclick="logout()" class="btn-logout">Logout</button>
        `;
      } else {
        authBox.innerHTML = `
          <a href="index.html" class="nav-btn" style="background:#546e7a; margin-right:5px;">Dashboard</a>
          <a href="login.html?redirect=${encodeURIComponent(window.location.href)}" class="nav-btn">Login</a>
        `;
      }
    }

    function goToForm() {
      window.location.href = `form.html?id=${currentSystemId}`;
    }

    function goToHistory() {
      window.location.href = `history.html?id=${currentSystemId}`;
    }

    function switchAccount() {
      sessionStorage.clear();
      window.location.href = `login.html?redirect=${encodeURIComponent(window.location.href)}`;
    }

    function logout() {
      sessionStorage.clear();
      window.location.reload();
    }
  </script>
</body>
</html>

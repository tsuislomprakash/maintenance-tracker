<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Maintenance Entry (Geo-Fenced)</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <script>
    if (sessionStorage.getItem('isLoggedIn') !== 'true') {
      window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
    }
  </script>

  <div class="container">
    <header>
      <div class="header-left">
        <h2>Log Maintenance Record</h2>
        <small id="lockedNotice" style="color:#2e7d32; font-weight:bold;"></small>
      </div>

      <div class="user-controls">
        <span class="user-badge-info">👤 <strong id="userDisplay"></strong></span>
        <span id="navButtonsContainer"></span>
        <button onclick="switchAccount()" class="btn-switch">Switch Account</button>
        <button onclick="logout()" class="btn-logout">Logout</button>
      </div>
    </header>

    <div id="geoAlertBox" style="background:#e8f5e9; border-left:5px solid #2e7d32; padding:12px; border-radius:4px; margin-bottom:15px; font-size:13px;">
      📍 <strong>Geo-Fencing Active:</strong> Submission requires physical presence within <strong>50 meters</strong> of the registered control panel.
    </div>

    <form id="maintenanceForm">
      <div class="form-grid">
        
        <div class="form-group">
          <label for="systemId">System ID *</label>
          <input type="text" id="systemId" placeholder="e.g. ADG-01, SIG-01" required style="font-weight:bold; background:#e8eaf6;">
        </div>

        <div class="form-group">
          <label for="department">Department *</label>
          <input type="text" id="department" placeholder="e.g., Electrical / Signaling" required>
        </div>

        <div class="form-group">
          <label for="location">Location *</label>
          <input type="text" id="location" placeholder="e.g., Gate 4 / Junction 2" required>
        </div>

        <div class="form-group">
          <label for="supervisor">Supervisor Name *</label>
          <input type="text" id="supervisor" required>
        </div>

        <div class="form-group">
          <label for="systemType">System Type *</label>
          <select id="systemType" required>
            <option value="">-- Select Type --</option>
            <option value="Automatic Drop Gate">Automatic Drop Gate</option>
            <option value="Manual Drop Gate">Manual Drop Gate</option>
            <option value="Traffic Signal">Traffic Signal</option>
            <option value="AVA">AVA</option>
            <option value="Flickering Light">Flickering Light</option>
          </select>
        </div>

        <div class="form-group">
          <label for="maintenanceType">Type of Maintenance *</label>
          <select id="maintenanceType" required>
            <option value="Preventive">Preventive (Routine)</option>
            <option value="Breakdown">Breakdown</option>
          </select>
        </div>

        <div class="form-group">
          <label for="maintenanceDate">Date of Maintenance *</label>
          <input type="date" id="maintenanceDate" required onchange="calculateNextDue(this.value)">
        </div>

        <div class="form-group">
          <label for="maintenanceTime">Time of Maintenance *</label>
          <input type="time" id="maintenanceTime" required>
        </div>

        <div class="form-group">
          <label for="nextDueDate">Next Due Date (Auto +15 Days) *</label>
          <input type="date" id="nextDueDate" required style="background:#f1f8e9; font-weight:bold;">
        </div>

        <div class="form-group">
          <label for="priority">Priority *</label>
          <select id="priority" required>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
          </select>
        </div>

        <div class="form-group">
          <label for="status">Status *</label>
          <select id="status" required>
            <option value="Completed">Completed</option>
            <option value="Pending">Pending</option>
          </select>
        </div>

        <div class="form-group">
          <label for="partReplaced">Parts Replaced (if any)</label>
          <input type="text" id="partReplaced" placeholder="e.g. Flashing LED Bulb, Relay, Gear Oil">
        </div>

        <div class="form-group">
          <label for="partNumber">Part / Serial Number (if any)</label>
          <input type="text" id="partNumber" placeholder="e.g. PN-LED-4401, REL-24V-8A">
        </div>

        <div class="form-group full-width">
          <label for="issue">Issue / Directive Checked *</label>
          <textarea id="issue" rows="2" placeholder="Enter 'Nil' or 'None' if normal preventive routine" required></textarea>
        </div>

        <div class="form-group full-width">
          <label for="actionTaken">Action Taken *</label>
          <textarea id="actionTaken" rows="2" required></textarea>
        </div>

        <div class="form-group full-width">
          <label for="attachment">Attachment (Photo / Inspection Report)</label>
          <input type="file" id="attachment" accept="image/*,application/pdf">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn" style="width:100%;">Verify GPS (50m Tolerance) & Submit Log</button>
    </form>
  </div>

  <script>
    // =========================================================================
    // 1. MASTER REGISTERED LOCATIONS
    // ADG-01 is set to your exact photo coordinates: 22.758222, 86.190747
    // =========================================================================
    const REGISTERED_LOCATIONS = {
      "ADG-01": { lat: 22.758222, lng: 86.190747 }
    };

    const GEO_FENCE_TOLERANCE_METERS = 50; // 50 Meters Tolerance Range

    const firebaseConfig = {
      apiKey: "AIzaSyAP08KrIvlKOC0mu6CS9cyHGHtE_yMfZS4",
      authDomain: "maintenance-tracker-9232f.firebaseapp.com",
      projectId: "maintenance-tracker-9232f",
      storageBucket: "maintenance-tracker-9232f.firebasestorage.app",
      messagingSenderId: "1028949858608",
      appId: "1:1028949858608:web:ca651824fedab23cb890f5",
      measurementId: "G-R0560TMM98"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let dedicatedId = null;
    let linkedPlanId = null;

    window.onload = function() {
      const user = sessionStorage.getItem('activeUser') || 'User';
      const role = sessionStorage.getItem('userRole') || 'Supervisor';
      document.getElementById('userDisplay').innerText = `${user} (${role.toUpperCase()})`;

      const now = new Date();
      const today = now.toISOString().split('T')[0];
      const timeNow = now.toTimeString().substring(0, 5);

      document.getElementById('maintenanceDate').value = today;
      document.getElementById('maintenanceTime').value = timeNow;
      calculateNextDue(today);

      const urlParams = new URLSearchParams(window.location.search);
      dedicatedId = urlParams.get('id');
      linkedPlanId = urlParams.get('planId');
      const preIssue = urlParams.get('issue');
      const preType = urlParams.get('type');

      const navContainer = document.getElementById('navButtonsContainer');

      if (dedicatedId) {
        const sysField = document.getElementById('systemId');
        sysField.value = dedicatedId.toUpperCase();
        sysField.readOnly = true;
        document.getElementById('lockedNotice').innerText = `[Locked to Unit: ${dedicatedId.toUpperCase()}]`;
        
        if (dedicatedId.includes("ADG")) document.getElementById('systemType').value = "Automatic Drop Gate";
        else if (dedicatedId.includes("MDG")) document.getElementById('systemType').value = "Manual Drop Gate";
        else if (dedicatedId.includes("SIG")) document.getElementById('systemType').value = "Traffic Signal";
        else if (dedicatedId.includes("AVA")) document.getElementById('systemType').value = "AVA";
        else if (dedicatedId.includes("FL")) document.getElementById('systemType').value = "Flickering Light";

        navContainer.innerHTML = `
          <a href="device.html?id=${encodeURIComponent(dedicatedId)}" class="nav-btn" style="background:#1a237e;">← Unit Hub</a>
          <a href="history.html?id=${encodeURIComponent(dedicatedId)}" class="nav-btn" style="background:#546e7a;">Unit Logs</a>
        `;
      } else {
        navContainer.innerHTML = `
          <a href="index.html" class="nav-btn" style="background:#1a237e;">← Dashboard</a>
          <a href="history.html" class="nav-btn" style="background:#546e7a;">History</a>
        `;
      }

      if (preIssue) document.getElementById('issue').value = decodeURIComponent(preIssue);
      if (preType) document.getElementById('maintenanceType').value = preType;
    };

    function calculateNextDue(dateString) {
      if (!dateString) return;
      const d = new Date(dateString);
      d.setDate(d.getDate() + 15);
      document.getElementById('nextDueDate').value = d.toISOString().split('T')[0];
    }

    // HAVERSINE FORMULA: Precision Distance in Meters
    function calculateDistanceInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Earth radius in meters
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      return Math.round(R * c);
    }

    function getCurrentGPS() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Geolocation is not supported by your mobile browser."));
        } else {
          navigator.geolocation.getCurrentPosition(
            pos => {
              resolve({
                lat: parseFloat(pos.coords.latitude.toFixed(6)),
                lng: parseFloat(pos.coords.longitude.toFixed(6)),
                accuracy: pos.coords.accuracy
              });
            },
            err => reject(new Error("GPS Location Permission Denied. Please enable Location in your phone browser settings.")),
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        }
      });
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        if (!file) { resolve(null); return; }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    document.getElementById('maintenanceForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Checking 50m Geo-Fence Distance...";
      btn.disabled = true;

      const selectedId = document.getElementById('systemId').value.trim().toUpperCase();
      let liveGPS = null;

      try {
        liveGPS = await getCurrentGPS();
      } catch (err) {
        alert("🚨 Geo-Verification Error: " + err.message);
        btn.innerText = "Verify GPS (50m Tolerance) & Submit Log";
        btn.disabled = false;
        return;
      }

      let calculatedDistance = 0;
      let geoVerified = "VERIFIED_WITHIN_50M";

      // Tolerance Verification
      if (REGISTERED_LOCATIONS[selectedId]) {
        const target = REGISTERED_LOCATIONS[selectedId];
        calculatedDistance = calculateDistanceInMeters(liveGPS.lat, liveGPS.lng, target.lat, target.lng);

        if (calculatedDistance > GEO_FENCE_TOLERANCE_METERS) {
          alert(`❌ GEO-FENCE REJECTED!\n\nYou are ${calculatedDistance} meters away from ${selectedId}.\nAllowed tolerance is maximum ${GEO_FENCE_TOLERANCE_METERS} meters.\n\nPlease stand near the equipment to submit maintenance.`);
          btn.innerText = "Verify GPS (50m Tolerance) & Submit Log";
          btn.disabled = false;
          return;
        }
      } else {
        geoVerified = "REGISTERED_NEW_SPOT";
      }

      const fileInput = document.getElementById('attachment');
      let base64File = null;
      if (fileInput.files.length > 0) {
        if (fileInput.files[0].size > 1.5 * 1024 * 1024) {
          alert("Attachment is too large. Please upload an image under 1.5MB.");
          btn.innerText = "Verify GPS (50m Tolerance) & Submit Log";
          btn.disabled = false;
          return;
        }
        base64File = await fileToBase64(fileInput.files[0]);
      }

      const record = {
        systemId: selectedId,
        department: document.getElementById('department').value.trim(),
        location: document.getElementById('location').value.trim(),
        supervisor: document.getElementById('supervisor').value.trim(),
        systemType: document.getElementById('systemType').value,
        maintenanceType: document.getElementById('maintenanceType').value,
        maintenanceDate: document.getElementById('maintenanceDate').value,
        maintenanceTime: document.getElementById('maintenanceTime').value,
        nextDueDate: document.getElementById('nextDueDate').value,
        priority: document.getElementById('priority').value,
        status: document.getElementById('status').value,
        partReplaced: document.getElementById('partReplaced').value.trim() || "None",
        partNumber: document.getElementById('partNumber').value.trim() || "N/A",
        issue: document.getElementById('issue').value.trim(),
        actionTaken: document.getElementById('actionTaken').value.trim(),
        gpsLat: liveGPS.lat,
        gpsLng: liveGPS.lng,
        gpsMapUrl: `https://www.google.com/maps?q=${liveGPS.lat},${liveGPS.lng}`,
        geoDistanceMeters: calculatedDistance,
        geoAuditStatus: geoVerified,
        attachmentData: base64File,
        attachmentName: fileInput.files[0] ? fileInput.files[0].name : null,
        submittedBy: sessionStorage.getItem('activeUser') || 'Technician',
        createdAt: new Date().toISOString()
      };

      try {
        await db.collection("maintenance_records").add(record);

        if (linkedPlanId) {
          await db.collection("maintenance_plans").doc(linkedPlanId).update({
            status: "COMPLETED",
            closedAt: new Date().toISOString(),
            closedBy: sessionStorage.getItem('activeUser') || 'Supervisor'
          });
        }

        alert(`✅ GEO-FENCE PASSED!\nDistance to Equipment: ${calculatedDistance} meters (Within 50m tolerance).\nLog Successfully Synced to Cloud!`);
        if (dedicatedId) {
          window.location.href = `history.html?id=${encodeURIComponent(dedicatedId)}`;
        } else {
          window.location.href = "history.html";
        }
      } catch (err) {
        alert("❌ Error saving: " + err.message);
        btn.innerText = "Verify GPS (50m Tolerance) & Submit Log";
        btn.disabled = false;
      }
    });

    function switchAccount() {
      sessionStorage.clear();
      window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
    }

    function logout() {
      sessionStorage.clear();
      if (dedicatedId) {
        window.location.href = `device.html?id=${encodeURIComponent(dedicatedId)}`;
      } else {
        window.location.href = 'login.html';
      }
    }
  </script>
</body>
</html>
